<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TM2020 Material Assets Library</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;margin:32px auto;padding:0 24px;max-width:1400px;background:#121720;color:#edf0f4}h1{line-height:1.15}a{color:#89d3ff}input,select{font:inherit;padding:10px;background:#202b39;color:inherit;border:1px solid #52657d;border-radius:6px;margin:0 8px 8px 0}input{width:min(440px,90%)}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}article{background:#202b39;border-radius:10px;padding:16px;overflow-wrap:anywhere}img{width:100%;height:180px;object-fit:contain}h2{font-size:15px}small{color:#c3cedc}p{max-width:900px}.preview{color:#ffd17e}li{margin-bottom:6px}summary{cursor:pointer}
</style>
<h1>TM2020 Material Assets Library</h1>
<p>Offline material catalogue · __EDITION__ · <a href="../docs/USAGE.md">Usage guide</a> · <a href="../docs/BADGES.md">Badge legend</a></p>
<p>Native-linked materials provide a game export route. Their Blender appearance may differ from the game. Preview only materials have no confirmed export route.</p>
<label>Search <input id="search" type="search" placeholder="Material, category, physics or gameplay"></label>
<label>Show <select id="status"><option value="all">All materials</option><option value="linked">Native-linked materials</option><option value="preview">Preview only</option></select></label>
<p id="count" aria-live="polite"></p><main id="grid"></main>
<script id="data" type="application/json">__MATERIAL_DATA__</script>
<script>
const rows=JSON.parse(document.getElementById('data').textContent),grid=document.getElementById('grid');
function el(tag,text){const e=document.createElement(tag);if(text)e.textContent=text;return e}
function render(){const q=document.getElementById('search').value.toLowerCase(),status=document.getElementById('status').value;const shown=rows.filter(r=>(status==='all'||(status==='preview')===r.preview_only)&&[r.name,r.catalog,r.physics,r.gameplay,...r.usage].join(' ').toLowerCase().includes(q));grid.replaceChildren();document.getElementById('count').textContent=shown.length+' / '+rows.length+' materials';for(const r of shown){const card=el('article'),im=el('img');im.src='previews/'+r.id+'.png';im.alt=r.name;im.loading='lazy';card.append(im,el('h2',r.name));const state=el('p',r.preview_only?'Preview only':'Native-linked');if(r.preview_only)state.className='preview';card.append(state,el('small',r.catalog));const details=el('details');details.append(el('summary','Usage and material details'));const list=el('ul');for(const line of r.usage)list.append(el('li',line));details.append(list,el('p','Physics: '+(r.physics||'Default')+' · Gameplay: '+(r.gameplay||'None')));if(r.conditional)details.append(el('p','Colours depend on the game accessibility setting.'));card.append(details);grid.append(card)}}
document.getElementById('search').addEventListener('input',render);document.getElementById('status').addEventListener('change',render);render();
</script></html>
